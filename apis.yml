aid: avomd
name: AvoMD
description: >-
  AvoMD (Avo) is a clinical AI platform that integrates directly with electronic
  health record (EHR) systems to power AI copilots for healthcare workflows. It
  combines EHR data with trusted clinical knowledge bases to support decision-making,
  documentation, and care delivery across inpatient and outpatient settings. Avo's
  product line includes Chart Assist, an AI Scribe for ambient clinical documentation,
  and AI Consult, serving rural and small hospitals, large and mid-size hospitals,
  and ambulatory care, in partnership with medical societies and knowledge partners.
  The company is SOC 2 Type II compliant and backed by 500 Global.
